[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Netlify serves files from /public with `cache-control: public, max-age=0,
# must-revalidate` by default, so every repeat visitor pays a revalidation
# round-trip for the case-study videos and their posters. These paths are only
# ever changed by shipping a new filename, so they are safe to cache hard.
# `stale-while-revalidate` keeps a replaced-in-place file from going stale for
# longer than a day.

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Legacy URLs from the pre-rebuild site. Google still crawls both and records
# them under "Not found (404)" — first detected 2025-06-28, still listed in
# Search Console on 2026-08-03. 301 so the equity they carry lands on the
# closest live page instead of being discarded.
[[redirects]]
  from = "/about-pattrix"
  to = "/#about"
  status = 301
  force = true

[[redirects]]
  from = "/pattrix-authentic-storytelling-for-modern-marketing-success-in-2025-and-beyond"
  to = "/insights"
  status = 301
  force = true
